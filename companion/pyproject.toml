[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-local-structure"
version = "0.2.0"
description = "Closure, quadrangle coefficients and edge-typed graphlets for NetworkX graphs"
readme = "README.md"
requires-python = ">=3.12,!=3.14.1"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Mingshan Jia"}]
dependencies = ["networkx>=3.7,<4"]

[project.urls]
Repository = "https://github.com/MingshanJia/explore-local-structure"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=4"]
dev = ["ruff>=0.15", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
